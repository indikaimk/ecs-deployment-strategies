name: Deploy - Linear (10% Every 1 Min)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag in ECR to deploy'
        required: true
        default: 'latest'
      app_version:
        description: 'Version string (displayed on UI)'
        required: true
        default: 'v2.0.0'
      app_color:
        description: 'UI theme color (green, purple)'
        required: true
        default: 'green'
      app_release_title:
        description: 'Release title'
        required: true
        default: 'Linear Candidate - v2.0.0 (10% per min)'

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  CLUSTER_NAME: ecs-demo-demo-cluster
  SERVICE_NAME: demo-linear-service
  TASK_FAMILY: demo-linear-app
  APPLICATION_NAME: linear-demo-app
  DEPLOYMENT_GROUP_NAME: linear-demo-dg
  ECR_REPOSITORY: ecs-deployment-demo

jobs:
  deploy-linear:
    name: Execute CodeDeploy Linear 10% Shift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Register New Linear Task Definition Revision
        id: render-task-def
        run: |
          ECR_REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.event.inputs.image_tag }}"

          echo "Fetching latest active task definition for family: $TASK_FAMILY..."
          TASK_DEF_JSON=$(aws ecs describe-task-definition --task-definition "$TASK_FAMILY" --query 'taskDefinition')

          NEW_DEF=$(echo "$TASK_DEF_JSON" | jq \
            --arg IMAGE "$IMAGE_URI" \
            --arg VER "${{ github.event.inputs.app_version }}" \
            --arg COLOR "${{ github.event.inputs.app_color }}" \
            --arg TITLE "${{ github.event.inputs.app_release_title }}" \
            '.containerDefinitions[0].image = $IMAGE |
             .containerDefinitions[0].environment = [
               {"name": "APP_VERSION", "value": $VER},
               {"name": "APP_COLOR", "value": $COLOR},
               {"name": "APP_RELEASE_TITLE", "value": $TITLE}
             ] |
             del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)')

          echo "$NEW_DEF" > new-task-def.json

          NEW_TASK_ARN=$(aws ecs register-task-definition --cli-input-json file://new-task-def.json --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "Registered: $NEW_TASK_ARN"
          echo "new_task_arn=$NEW_TASK_ARN" >> $GITHUB_OUTPUT

      - name: Trigger CodeDeploy Linear Deployment
        id: trigger-codedeploy
        run: |
          NEW_TASK_ARN="${{ steps.render-task-def.outputs.new_task_arn }}"

          APPSPEC_CONTENT=$(jq -n \
            --arg TASK_ARN "$NEW_TASK_ARN" \
            '{
              version: 0.0,
              Resources: [
                {
                  TargetService: {
                    Type: "AWS::ECS::Service",
                    Properties: {
                      TaskDefinition: $TASK_ARN,
                      LoadBalancerInfo: {
                        ContainerName: "web",
                        ContainerPort: 3000
                      }
                    }
                  }
                }
              ]
            }')

          echo "Initiating CodeDeploy Linear Deployment..."
          DEPLOYMENT_ID=$(aws deploy create-deployment \
            --application-name "$APPLICATION_NAME" \
            --deployment-group-name "$DEPLOYMENT_GROUP_NAME" \
            --revision "{\"revisionType\": \"AppSpecContent\", \"appSpecContent\": {\"content\": $(echo $APPSPEC_CONTENT | jq -R .)}}" \
            --description "Linear deploy: ${{ github.event.inputs.app_version }}" \
            --query "deploymentId" \
            --output text)

          echo "CodeDeploy Deployment ID: $DEPLOYMENT_ID"
          echo "deployment_id=$DEPLOYMENT_ID" >> $GITHUB_OUTPUT

      - name: Monitor Linear Shift & Alarm Status
        run: |
          DEPLOYMENT_ID="${{ steps.trigger-codedeploy.outputs.deployment_id }}"
          echo "Monitoring deployment: $DEPLOYMENT_ID"

          while true; do
            STATUS=$(aws deploy get-deployment --deployment-id "$DEPLOYMENT_ID" --query "deploymentInfo.status" --output text)
            echo "Current Status: $STATUS..."

            if [ "$STATUS" = "Succeeded" ]; then
              echo "Linear deployment succeeded! 100% traffic shifted to Green."
              break
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Stopped" ]; then
              ERROR_INFO=$(aws deploy get-deployment --deployment-id "$DEPLOYMENT_ID" --query "deploymentInfo.errorInformation" --output json)
              echo "Deployment FAILED or ROLLED BACK: $ERROR_INFO"
              exit 1
            fi
            sleep 15
          done
